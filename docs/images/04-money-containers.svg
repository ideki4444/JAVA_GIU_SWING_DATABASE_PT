<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1370" viewBox="0 0 1100 1370" role="img" aria-labelledby="title desc">
<title id="title">Sales, cash, stock and gallons are distinct</title>
<desc id="desc">Two refills at PHP25 produce a PHP50 Credit order. Borrowing two gallons gives two gallons out. Recording a PHP20 payment and one return leaves PHP30 unpaid and one gallon out; original credit sales remain PHP50. Inventory sold as products differs from borrowed containers. Delivery normally progresses Pending to Out for Delivery to Delivered; the current UI also permits Pending directly to Delivered without a rider.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 5 L 0 10 z" fill="#087F82"/></marker></defs>
<rect width="1100" height="1370" fill="#F5F8FB"/>
<rect width="1100" height="145" fill="#11283F"/>
<text x="48" y="37" fill="#91DBD5" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start">AQUATRACK  /  FIELD GUIDE 04</text>
<text x="48" y="84" fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" font-weight="700" text-anchor="start">Sales, cash, stock and gallons are distinct</text>
<text x="48" y="120" fill="#D3E2EC" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Worked example: a new customer starts with zero debt and zero gallons out.</text>
<rect x="48" y="175" width="1004" height="145" rx="18" fill="#E8F5F3" stroke="#CEDBE4" stroke-width="1.5"/>
<text x="72" y="219" fill="#11283F" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start">A  Save a Credit delivery order</text>
<text x="72" y="260" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">2 refills × PHP 25.00 = PHP 50.00 sales; borrow 2, return 0.</text>
<text x="72" y="291" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Debt becomes PHP 50.00. Gallons out becomes 2. Status: Pending.</text>
<path d="M 550 325 L 550 348" fill="none" stroke="#087F82" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="48" y="355" width="1004" height="145" rx="18" fill="#FFFFFF" stroke="#CEDBE4" stroke-width="1.5"/>
<text x="72" y="399" fill="#11283F" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start">B  Later: record PHP 20.00 and one gallon returned</text>
<text x="72" y="440" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Unpaid balance = Credit order totals − recorded credit payments.</text>
<text x="72" y="471" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Gallons out = all Borrowed quantities − all Returned quantities.</text>
<rect x="48" y="525" width="484" height="165" rx="18" fill="#E8F5F3" stroke="#CEDBE4" stroke-width="1.5"/>
<text x="72" y="569" fill="#11283F" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start">PHP 30.00 unpaid</text>
<text x="72" y="610" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">PHP 50.00 − PHP 20.00.</text>
<text x="72" y="641" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">The original Credit sales total</text>
<text x="72" y="672" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">remains PHP 50.00.</text>
<rect x="568" y="525" width="484" height="165" rx="18" fill="#E8F5F3" stroke="#CEDBE4" stroke-width="1.5"/>
<text x="592" y="569" fill="#11283F" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start">1 gallon out</text>
<text x="592" y="610" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">2 borrowed − 1 returned.</text>
<text x="592" y="641" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">A return outside a sale is entered</text>
<text x="592" y="672" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">in Containers &amp; Balances.</text>
<rect x="48" y="715" width="484" height="205" rx="18" fill="#FFFFFF" stroke="#CEDBE4" stroke-width="1.5"/>
<text x="72" y="759" fill="#11283F" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start">Sellable stock</text>
<text x="72" y="800" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Containers and caps/seals lose</text>
<text x="72" y="831" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">stock when a sale is saved.</text>
<text x="72" y="862" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Refills are untracked; they do</text>
<text x="72" y="893" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">not automatically consume caps.</text>
<rect x="568" y="715" width="484" height="205" rx="18" fill="#FFFFFF" stroke="#CEDBE4" stroke-width="1.5"/>
<text x="592" y="759" fill="#11283F" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start">Loaned containers</text>
<text x="592" y="800" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Gallons count customer loans.</text>
<text x="592" y="831" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">No effect on product stock</text>
<text x="592" y="862" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">or the charge for the order.</text>
<text x="592" y="893" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Record a sale separately if sold.</text>
<text x="48" y="965" fill="#087F82" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start">DELIVERY STATUS: RECOMMENDED OPERATING PATH</text>
<rect x="48" y="990" width="250" height="66" rx="18" fill="#FFFFFF" stroke="#CEDBE4" stroke-width="1.5"/>
<rect x="373" y="990" width="354" height="66" rx="18" fill="#FFFFFF" stroke="#CEDBE4" stroke-width="1.5"/>
<rect x="802" y="990" width="250" height="66" rx="18" fill="#FFFFFF" stroke="#CEDBE4" stroke-width="1.5"/>
<text x="173" y="1032" fill="#11283F" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle">Pending</text>
<text x="550" y="1032" fill="#11283F" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle">Out for Delivery</text>
<text x="927" y="1032" fill="#11283F" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle">Delivered</text>
<path d="M 306 1023 L 365 1023" fill="none" stroke="#087F82" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 735 1023 L 794 1023" fill="none" stroke="#087F82" stroke-width="3" marker-end="url(#arrow)"/>
<text x="48" y="1098" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Dispatch requires a rider. A delivered order cannot change riders.</text>
<text x="48" y="1133" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Current shortcut: Pending → Delivered is allowed, even without a rider.</text>
<text x="48" y="1168" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Delivery status never records a payment; collect Credit payments separately.</text>
<rect x="48" y="1220" width="1004" height="84" rx="18" fill="#FFF2D8" stroke="#FFF2D8" stroke-width="1.5"/>
<text x="72" y="1257" fill="#B67913" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">Avoid double-counting</text>
<text x="72" y="1294" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Cash orders are already paid in full; do not record another credit payment.</text>
<path d="M 48 1318 H 1052" stroke="#CEDBE4"/>
<text x="48" y="1346" fill="#4A6173" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">AquaTrack v3  •  Read the README for exact commands and screen instructions</text>
</svg>
