<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1370" viewBox="0 0 1100 1370" role="img" aria-labelledby="title desc">
<title id="title">Eight tables, one business record system</title>
<desc id="desc">Eight tables: users, customers, products, delivery_staff, orders, order_items, payments and container_ledger. Each order references one customer and creator, optionally a rider. Order items link orders to products and store saved prices. Payments reference customers rather than individual orders. Container movements reference customers and optionally orders. Foreign keys restrict parent deletion; archive records to retain their history.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 5 L 0 10 z" fill="#087F82"/></marker></defs>
<rect width="1100" height="1370" fill="#F5F8FB"/>
<rect width="1100" height="145" fill="#11283F"/>
<text x="48" y="37" fill="#91DBD5" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start">AQUATRACK  /  FIELD GUIDE 05</text>
<text x="48" y="84" fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" font-weight="700" text-anchor="start">Eight tables, one business record system</text>
<text x="48" y="120" fill="#D3E2EC" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Primary keys identify rows; foreign keys link records without duplicating them.</text>
<rect x="48" y="175" width="484" height="170" rx="18" fill="#FFFFFF" stroke="#CEDBE4" stroke-width="1.5"/>
<text x="72" y="219" fill="#11283F" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start">users</text>
<text x="72" y="260" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">PK user_id; username; password hash</text>
<text x="72" y="291" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Full name, role, active flag.</text>
<text x="72" y="322" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">App logins and order creators.</text>
<rect x="568" y="175" width="484" height="170" rx="18" fill="#FFFFFF" stroke="#CEDBE4" stroke-width="1.5"/>
<text x="592" y="219" fill="#11283F" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start">customers</text>
<text x="592" y="260" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">PK customer_id; name; address</text>
<text x="592" y="291" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Contact number; archived flag.</text>
<text x="592" y="322" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Each sale needs a customer.</text>
<rect x="48" y="365" width="484" height="170" rx="18" fill="#FFFFFF" stroke="#CEDBE4" stroke-width="1.5"/>
<text x="72" y="409" fill="#11283F" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start">products</text>
<text x="72" y="450" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">PK product_id; name; category</text>
<text x="72" y="481" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Unit price, stock, reorder level.</text>
<text x="72" y="512" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Active flag controls availability.</text>
<rect x="568" y="365" width="484" height="170" rx="18" fill="#FFFFFF" stroke="#CEDBE4" stroke-width="1.5"/>
<text x="592" y="409" fill="#11283F" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start">delivery_staff</text>
<text x="592" y="450" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">PK staff_id; name; contact</text>
<text x="592" y="481" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Active flag; independent of logins.</text>
<text x="592" y="512" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">An order may have no rider yet.</text>
<rect x="48" y="555" width="484" height="170" rx="18" fill="#FFFFFF" stroke="#CEDBE4" stroke-width="1.5"/>
<text x="72" y="599" fill="#11283F" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start">orders</text>
<text x="72" y="640" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">PK order_id; customer; creator</text>
<text x="72" y="671" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Optional rider; date; total</text>
<text x="72" y="702" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Type, payment type, delivery status.</text>
<rect x="568" y="555" width="484" height="170" rx="18" fill="#FFFFFF" stroke="#CEDBE4" stroke-width="1.5"/>
<text x="592" y="599" fill="#11283F" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start">order_items</text>
<text x="592" y="640" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">PK item_id; order_id; product_id</text>
<text x="592" y="671" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Quantity; saved price; line total.</text>
<text x="592" y="702" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Many lines can belong to one order.</text>
<rect x="48" y="745" width="484" height="170" rx="18" fill="#FFFFFF" stroke="#CEDBE4" stroke-width="1.5"/>
<text x="72" y="789" fill="#11283F" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start">payments</text>
<text x="72" y="830" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">PK payment_id; customer_id</text>
<text x="72" y="861" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Amount and payment date.</text>
<text x="72" y="892" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Credit payments are customer-wide.</text>
<rect x="568" y="745" width="484" height="170" rx="18" fill="#FFFFFF" stroke="#CEDBE4" stroke-width="1.5"/>
<text x="592" y="789" fill="#11283F" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start">container_ledger</text>
<text x="592" y="830" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">PK ledger_id; customer_id</text>
<text x="592" y="861" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Borrowed / Returned; quantity; date</text>
<text x="592" y="892" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Optional order_id links a sale.</text>
<rect x="48" y="940" width="1004" height="266" rx="18" fill="#E8F5F3" stroke="#E8F5F3" stroke-width="1.5"/>
<text x="72" y="982" fill="#087F82" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">RELATIONSHIPS  •  Parent 1 → many child records</text>
<text x="72" y="1029" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">customers → orders, payments, container_ledger</text>
<text x="72" y="1067" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">users → orders (created_by); delivery_staff → orders (staff_id)</text>
<text x="72" y="1105" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">orders → order_items, container_ledger (optional order link)</text>
<text x="72" y="1143" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">products → order_items</text>
<rect x="48" y="1227" width="1004" height="83" rx="18" fill="#FFF2D8" stroke="#FFF2D8" stroke-width="1.5"/>
<text x="72" y="1264" fill="#B67913" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">History is retained</text>
<text x="72" y="1301" fill="#203B50" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Foreign keys restrict parent deletion. Archive used customers or products.</text>
<path d="M 48 1318 H 1052" stroke="#CEDBE4"/>
<text x="48" y="1346" fill="#4A6173" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">AquaTrack v3  •  Read the README for exact commands and screen instructions</text>
</svg>
